name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Contrast gate (design-system.md §1.3)
        run: npm run check:contrast

      # ADVISORY ON PR, BLOCKING ON DEPLOY (docs/roadmap.md M8).
      #
      # This step exits 1 by design while content is deferred, and it is step 3
      # of 12: leaving it blocking meant lint, typecheck and build never ran in
      # CI on any commit from M1 to M7 — the workflow was red for six
      # milestones and told us nothing. The placeholder count is still printed
      # and still read; M8 re-tightens this on the deploy path, where shipping
      # a TODO email actually costs something.
      - name: Placeholder gate (advisory — see docs/roadmap.md M8)
        run: npm run check:content
        continue-on-error: true

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      # Everything below needs the built site served. `npx next start`, not
      # `npm start`: next.config.mjs sets output "standalone" and next start
      # warns the two are incompatible — measured, they are not, because every
      # route is prerendered. The alternative, node .next/standalone/server.js,
      # needs .next/static and public/ copied in beside it first; M8's Docker
      # image does that copy, and this job does not need to.
      - run: npx playwright install --with-deps chromium

      # Redirected to a file, not left on stdout. A GitHub Actions step does
      # not finish until the pipes it opened are closed, so a backgrounded
      # server still holding stdout hangs the step forever — the job then
      # times out at 6 hours with no failing assertion to point at.
      - name: Serve the production build
        run: npx next start > /tmp/server.log 2>&1 &


      - name: Wait for the server
        run: npx --yes wait-on http://localhost:3000 --timeout 60000

      - name: Homepage suite (M1 acceptance + product.md §2.1 isolation)
        run: npm run test:e2e

      - name: Persona suite (product.md §2 isolation)
        run: npm run test:persona

      - name: Accessibility gate (design-system.md §7)
        run: npm run check:a11y

      - name: Performance budget gate (design-system.md §8)
        run: npm run check:budget

      # Only on failure, and only then: if a gate above went red because the
      # server died rather than because an assertion failed, this is the one
      # place that difference is visible.
      - name: Server log
        if: failure()
        run: cat /tmp/server.log
