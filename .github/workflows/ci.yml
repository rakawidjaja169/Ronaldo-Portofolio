name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Contrast gate (design-system.md §1.3)
        run: npm run check:contrast
      - name: Placeholder gate (no unresolved content values)
        run: npm run check:content
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
